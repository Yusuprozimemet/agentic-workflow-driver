name: Tests

# The project's own checks: the style check and the unit tests. The kit's other workflows test
# only the kit's tools.
#
# On pull requests and on main, not on every branch push: with `push:` unfiltered, each push to
# a branch with an open PR ran this twice (48 push runs beside 25 pull_request runs in the 200 runs
# up to 2026-11-08), and both appeared as checks on the PR. The pull_request run is the one
# branch protection requires by name.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the tests and the style check need
        run: python -m pip install -r requirements.txt ruff
      - name: Style check
        run: ruff check . && ruff format --check .
      - name: Run the tests
        run: python -m unittest discover -s tests -v
